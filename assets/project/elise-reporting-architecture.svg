<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Abstract motif: a multi-service data pipeline mapped as connected nodes across several repositories">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B22E0"/>
      <stop offset="1" stop-color="#150A33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#archBg)"/>

  <!-- edges -->
  <g stroke="#FFFFFF" fill="none" stroke-width="2.5" opacity="0.5">
    <path d="M180 300 L 330 180"/>
    <path d="M180 300 L 330 300"/>
    <path d="M180 300 L 330 420"/>
    <path d="M410 180 L 560 240"/>
    <path d="M410 300 L 560 240"/>
    <path d="M410 420 L 560 360"/>
    <path d="M410 300 L 560 360"/>
    <path d="M640 240 L 640 360" stroke-dasharray="7 7"/>
  </g>

  <!-- source node -->
  <g>
    <rect x="96" y="258" width="84" height="84" rx="16" fill="#FFFFFF" opacity="0.96"/>
    <g fill="#5B22E0">
      <rect x="116" y="282" width="44" height="8" rx="4"/>
      <rect x="116" y="300" width="44" height="8" rx="4" opacity="0.6"/>
      <rect x="116" y="318" width="28" height="8" rx="4" opacity="0.35"/>
    </g>
  </g>

  <!-- service tier -->
  <g fill="#FFFFFF" opacity="0.9">
    <rect x="330" y="148" width="80" height="64" rx="14"/>
    <rect x="330" y="268" width="80" height="64" rx="14"/>
    <rect x="330" y="388" width="80" height="64" rx="14"/>
  </g>
  <g fill="#5B22E0">
    <circle cx="370" cy="180" r="11"/>
    <circle cx="370" cy="300" r="11"/>
    <circle cx="370" cy="420" r="11"/>
  </g>

  <!-- output tier, one flagged as a defect -->
  <rect x="560" y="208" width="160" height="64" rx="14" fill="#FFFFFF" opacity="0.9"/>
  <rect x="560" y="328" width="160" height="64" rx="14" fill="#FFFFFF" opacity="0.9"/>
  <g fill="#5B22E0">
    <rect x="582" y="234" width="84" height="10" rx="5"/>
    <rect x="582" y="354" width="116" height="10" rx="5" opacity="0.45"/>
  </g>
  <circle cx="700" cy="328" r="13" fill="#FFFFFF"/>
  <rect x="697" y="320" width="6" height="11" rx="3" fill="#5B22E0"/>
  <circle cx="700" cy="335" r="3" fill="#5B22E0"/>
</svg>
