<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Abstract motif: recommendation slots lifted to a minimum floor across every provider">
  <defs><linearGradient id="mspBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#123F49"/><stop offset="1" stop-color="#071D22"/>
  </linearGradient></defs>
  <rect width="800" height="600" fill="url(#mspBg)"/>

  <!-- provider allocations, baseline y=420, composition centred on the visible band -->
  <g fill="#4DBEB4">
    <rect x="80"  y="250" width="56" height="170" rx="8"/>
    <rect x="166" y="190" width="56" height="230" rx="8"/>
    <rect x="252" y="286" width="56" height="134" rx="8"/>
    <rect x="338" y="222" width="56" height="198" rx="8"/>
  </g>
  <!-- the long tail, raised to the floor by the provider constraint -->
  <g fill="#8CD5CF">
    <rect x="424" y="286" width="56" height="134" rx="8" opacity="0.95"/>
    <rect x="510" y="286" width="56" height="134" rx="8" opacity="0.75"/>
    <rect x="596" y="286" width="56" height="134" rx="8" opacity="0.6"/>
    <rect x="682" y="286" width="56" height="134" rx="8" opacity="0.45"/>
  </g>
  <!-- what the tail would have been without the constraint -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 6" opacity="0.35">
    <rect x="424" y="368" width="56" height="52" rx="8"/>
    <rect x="510" y="386" width="56" height="34" rx="8"/>
    <rect x="596" y="396" width="56" height="24" rx="8"/>
    <rect x="682" y="402" width="56" height="18" rx="8"/>
  </g>

  <path d="M60 286 H760" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="12 9" opacity="0.8"/>
  <path d="M60 420 H760" stroke="#FFFFFF" stroke-width="2" opacity="0.45"/>
</svg>
