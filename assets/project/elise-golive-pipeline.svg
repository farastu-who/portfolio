<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Abstract motif: a staged go-live pipeline with validation checkpoints and one stalled stage">
  <defs>
    <linearGradient id="gliveBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7638FB"/>
      <stop offset="1" stop-color="#1C0C45"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#gliveBg)"/>

  <!-- pipeline rail -->
  <rect x="110" y="292" width="580" height="6" rx="3" fill="#FFFFFF" opacity="0.3"/>
  <rect x="110" y="292" width="350" height="6" rx="3" fill="#FFFFFF" opacity="0.85"/>

  <!-- stage checkpoints: three cleared, one stalled, one pending -->
  <g>
    <circle cx="140" cy="295" r="26" fill="#FFFFFF"/>
    <path d="M129 295 l 8 9 l 15 -17" stroke="#7638FB" stroke-width="5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <circle cx="300" cy="295" r="26" fill="#FFFFFF"/>
    <path d="M289 295 l 8 9 l 15 -17" stroke="#7638FB" stroke-width="5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <circle cx="460" cy="295" r="30" fill="#FFFFFF"/>
    <rect x="450" y="282" width="7" height="26" rx="3.5" fill="#7638FB"/>
    <rect x="463" y="282" width="7" height="26" rx="3.5" fill="#7638FB"/>
  </g>
  <circle cx="620" cy="295" r="22" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.55"/>

  <!-- upstream integration fan-in -->
  <g stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.4">
    <path d="M150 130 C 230 170, 250 230, 296 266"/>
    <path d="M300 120 C 310 180, 300 220, 300 266"/>
    <path d="M450 130 C 380 170, 320 230, 304 266"/>
  </g>
  <g fill="#FFFFFF" opacity="0.75">
    <rect x="112" y="104" width="76" height="30" rx="9"/>
    <rect x="262" y="92"  width="76" height="30" rx="9"/>
    <rect x="412" y="104" width="76" height="30" rx="9"/>
  </g>

  <!-- failure sub-types, classified below the stalled stage -->
  <g fill="#FFFFFF">
    <rect x="392" y="392" width="136" height="13" rx="6.5" opacity="0.9"/>
    <rect x="392" y="420" width="104" height="13" rx="6.5" opacity="0.62"/>
    <rect x="392" y="448" width="72"  height="13" rx="6.5" opacity="0.4"/>
    <rect x="392" y="476" width="44"  height="13" rx="6.5" opacity="0.25"/>
  </g>
  <path d="M460 330 L 460 380" stroke="#FFFFFF" stroke-width="2" opacity="0.45"/>
</svg>
