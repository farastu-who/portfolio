<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Abstract motif: many account nodes converging into a scoped set of CRM improvements">
  <defs>
    <linearGradient id="crmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7638FB"/>
      <stop offset="1" stop-color="#2A1060"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#crmBg)"/>

  <!-- scattered account nodes -->
  <g fill="#FFFFFF">
    <g opacity="0.28">
      <circle cx="110" cy="120" r="9"/><circle cx="180" cy="80" r="7"/>
      <circle cx="250" cy="135" r="8"/><circle cx="120" cy="210" r="7"/>
      <circle cx="196" cy="172" r="10"/><circle cx="268" cy="228" r="7"/>
      <circle cx="96"  cy="300" r="8"/><circle cx="174" cy="268" r="7"/>
      <circle cx="248" cy="318" r="9"/><circle cx="132" cy="378" r="7"/>
      <circle cx="206" cy="352" r="8"/><circle cx="286" cy="396" r="7"/>
    </g>
    <g opacity="0.95">
      <circle cx="196" cy="172" r="10"/><circle cx="248" cy="318" r="9"/>
      <circle cx="110" cy="120" r="9"/>
    </g>
  </g>

  <!-- convergence lines -->
  <g stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.45">
    <path d="M300 150 C 400 190, 430 220, 520 250"/>
    <path d="M300 250 C 400 255, 440 250, 520 250"/>
    <path d="M300 350 C 400 320, 430 285, 520 250"/>
  </g>

  <!-- scoped output -->
  <rect x="520" y="205" width="190" height="90" rx="14" fill="#FFFFFF" opacity="0.96"/>
  <g fill="#7638FB">
    <rect x="546" y="232" width="96" height="10" rx="5"/>
    <rect x="546" y="256" width="140" height="10" rx="5" opacity="0.55"/>
  </g>

  <!-- escalation trend, downward -->
  <g stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.6">
    <path d="M540 430 L 600 400 L 650 425 L 710 360"/>
  </g>
  <circle cx="710" cy="360" r="7" fill="#FFFFFF"/>
</svg>
